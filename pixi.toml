[workspace]
name = "tpms_jax"
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
# 版本与已验证可用的 JAX-FEM 环境保持一致(官方 environment.yml 同款 pin)
python = "3.13.*"
numpy = "==2.4.6"
scipy = "==1.17.1"
matplotlib = "==3.10.9"
meshio = "==5.3.5"
petsc4py = "==3.25.1"
mpi4py = ">=4.1.2,<5"
libglu = ">=9.0.3,<10"
xorg-libxft = ">=2.3.9,<3"

[pypi-dependencies]
setuptools = "==81.0.0"
wheel = "==0.47.0"
gmsh = "==4.15.2"
fenics-basix = "==0.10.0"
pyfiglet = "==1.0.4"
pytest = ">=8.0,<10"
jax = { version = ">=0.11.2, <0.12", extras = ["cuda12"] }
# 官方发布版(与旧环境验证的源码同为 0.0.12;选用 PyPI 是因为 WSL 到 GitHub 连接不稳定)
jax-fem = "==0.0.12"

[tasks]
test = "pytest tests/ -v"
